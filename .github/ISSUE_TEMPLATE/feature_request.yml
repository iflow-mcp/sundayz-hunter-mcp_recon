name: 💡 Feature Request
description: Suggest a new reconnaissance tool or enhancement for the MCP Web Reconnaissance Server
title: "feat: "
labels: ["enhancement"]
body:
- type: dropdown
  attributes:
    label: Feature Category
    description: What type of enhancement are you suggesting?
    options:
      - New Reconnaissance Tool
      - Enhancement to Existing Tool
      - New Information Gathering Method
      - DNS Analysis Improvement
      - Network Scanning Enhancement
      - Web Application Analysis Feature
      - Performance Optimization
      - Documentation Improvement
      - Installation/Setup Enhancement
      - Bug Bounty Workflow Improvement
      - Other
  validations:
    required: true
- type: textarea
  attributes:
    label: Feature Description
    description: |
      A clear and concise description of the feature you'd like to see added.
      Explain the problem this feature would solve for cybersecurity professionals.
  validations:
    required: true
- type: textarea
  attributes:
    label: Use Case/Scenario
    description: |
      Describe a specific bug bounty or security testing scenario where this feature would be valuable.
      Example: "When performing subdomain enumeration on large corporate targets..."
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: |
      Describe what you expect this feature to do and how it should work.
      Include any specific parameters, output format, or integration requirements.
    placeholder: |
      Example:
      - Tool name: certificate_analysis
      - Parameters: domain, check_ct_logs=True, validate_chain=True
      - Output: JSON with certificate details, CT log entries, validation status
      - Integration: Works with existing TLS tools
  validations:
    required: true
- type: textarea
  attributes:
    label: Reconnaissance Methodology Fit
    description: |
      How does this feature fit into the standard reconnaissance methodology?
      (Information Gathering → DNS Analysis → Network Reconnaissance → Web Analysis)
  validations:
    required: false
- type: textarea
  attributes:
    label: Alternative Solutions
    description: |
      Describe any alternative solutions, existing tools, or workarounds you've considered.
      Include any external tools that currently provide this functionality.
  validations:
    required: false
- type: textarea
  attributes:
    label: Implementation Ideas
    description: |
      If you have ideas about how to implement this feature, share them here.
      Include any relevant libraries, APIs, or technical approaches.
    placeholder: |
      Example:
      - Use Python library: certificate-transparency
      - API integration: crt.sh REST API
      - Dependencies: cryptography, requests
      - Performance considerations: rate limiting, caching
  validations:
    required: false
- type: textarea
  attributes:
    label: Security Considerations
    description: |
      Are there any security or ethical considerations for this feature?
      How should it respect rate limits, avoid detection, or ensure responsible use?
  validations:
    required: false
- type: textarea
  attributes:
    label: Additional Context
    description: |
      Add any other context, screenshots, research papers, or examples about the feature request here.
      
      Tip: You can attach images or files by clicking this area to highlight it and then dragging files in.
  validations:
    required: false
- type: checkboxes
  id: acknowledgements
  attributes:
    label: Acknowledgements
    description: Please confirm the following before submitting your feature request.
    options:
      - label: I have searched existing issues and this feature has not been requested yet.
        required: true
      - label: This is a single feature (not multiple features combined into one request).
        required: true
      - label: I have provided sufficient information to understand the proposed feature.
        required: true
      - label: This feature aligns with responsible security research and bug bounty practices.
        required: true
