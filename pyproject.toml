[project]
name = "iflow-mcp_sundayz-hunter-mcp-recon"
version = "1.0.2"
description = "MCP Server for Web Reconnaissance with Python-native tools"
authors = [
    {name = "Sundayz", email = "sundayz@example.com"}
]
requires-python = ">=3.10"

dependencies = [
    "mcp>=1.9.1",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.4",
    "dnspython>=2.7.0",
    "python-nmap>=0.7.1",
    "python-whois>=0.9.5",
    "ipaddress>=1.0.23",
]

[project.scripts]
iflow-mcp_sundayz-hunter-mcp-recon = "iflow_mcp_sundayz_hunter_mcp_recon.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
"*" = ["*.txt"]